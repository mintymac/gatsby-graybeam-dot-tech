[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "SOUS_CHEF_MODE"

[[redirects]]
  from = "/api/sous-chef/*"
  to = "/.netlify/functions/sous-chef/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/thanksgiving"
  to = "/thanksgiving/index.html"
  status = 200

[[redirects]]
  from = "/thanksgiving/"
  to = "/thanksgiving/index.html"
  status = 200

[[redirects]]
  from = "/sitemap/sitemap-0.xml"
  to = "/sitemap-index.xml"
  status = 301

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
